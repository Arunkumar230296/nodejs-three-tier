<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NodeJS Three Tier</title>
</head>
<body>
  <h1>NodeJS Three Tier Application</h1>

  <p id="status">Checking backend...</p>

  <script>
    fetch("/api-url")
      .then(response => response.json())
      .then(data => {
        document.getElementById("status").textContent =
          `Backend URL: ${data.backendUrl}`;
      })
      .catch(() => {
        document.getElementById("status").textContent =
          "Backend connection configuration unavailable";
      });
  </script>
</body>
</html>
